<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Ticket Pedido</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <!-- inicio de la cabecera -->
    <div class="modal-body">
        <div class="card border-secondary mb-3" th:if="${ticket != null}">
            <div class="card-header bg-secondary text-white fw-bold">
                Datos del Ticket
            </div>
            <div class="card-body">
                <p><strong>Numero de Ticket:</strong></p><span th:text="${ticket[0]}"></span></p>
                <p><strong>Fecha y hora:</strong><span th:text="${#temporals.format(ticket[1],'dd/MM/yyyy')}"></span>
                </p>
                <p><strong>Empleado:</strong> <span th:text="${ticket[2]}"></span></p>
                <p><strong>Cliente:</strong> <span th:text="${ticket[3]}"></span></p>
                <p><strong>Direccion:</strong> <span th:text="${ticket[4]}"></span></p>
                <p><strong>Telefono:</strong> <span th:text="${ticket[5]}"></span></p>
            </div>
        </div>
        <!-- fin de la cabecera -->
        <!-- inicio del detalle -->
        <div class="card border-dark">
            <table class="table table-sm table-bordered mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Producto</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Precio Unitario</th>
                        <th scope="col">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d: ${detalle}">
                        <td th:text="${d[0]}"></td>
                        <td th:text="${d[1]}"></td>
                        <td th:text="'S/. '+${#numbers.formatDecimal(d[2],1,2)}"></td>
                        <td th:text="'S/. '+${#numbers.formatDecimal(d[3],1,2)}"></td>
                    </tr>
                </tbody>

                <tr th:if="${detalle==null or #lists.isEmpty(detalle)}">
                    <td colspan="4" class="text-center">No hay detalle registrado</td>
                </tr>
            </table>
        </div>
        <!-- fin del detalle -->
        <!-- inicio de calculos -->
        <div class="text-end mt-3">
            <p><strong>SubTotal:</strong></p> <span th:text="${subtotal}"></span>
            <p><strong>IGV (18%):</strong></p> <span th:text="${igv}"></span>
            <p class="fw-bold text-primary"><strong>Total:</strong></p> <span th:text="${total}"></span>
        </div>
        <!-- fin de calculos -->

        <div class="modal-footer bg-light">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary" onclick="imprimirTicket()">Imprimir</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
