<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Ticket de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">


        <!-- Inicio del card -->


        <div class="card">
            <div class="card-header">
                <h1>Listado de Ticket de Pedido</h1>
                <div>
                    <a th:href="@{/ticketpedido/registro}" class="btn btn-primary">Registrar Ticket</a>
                    <a th:href="@{/menuprincipal}" class="btn btn-dark">Regresar</a>
                </div>
            </div>
            <div class="card-body">


                <!-- Inicio de tabla -->
                <div class="table-responsive">


                    <table class="table table-striped table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Numero</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Empleado</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Subtotal</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Anular</th>
                                <th scope="col">Habilitar</th>
                                <th scope="col">Detalle</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t: ${listarticket}">
                                <td scope="row" th:text="${t[0]}"> </td>
                                <td th:text="${#temporals.format(t[1],'dd/MM/yyyy')}"> </td>
                                <td th:text="${t[2]}"> </td>
                                <td th:text="${t[3]}"> </td>
                                <td th:text="'S/. '+${#numbers.formatDecimal(t[4],1,2)}"> </td>
                                <td>
                                    <span th:if="${t[5]}" class="badge bg-success">Habilitado</span>
                                    <span th:if="${!t[5]}" class="badge bg-danger">Deshabilitado</span>
                                </td>
                                <td><a th:href="@{/ticketpedido/anular/{id}(id=${t[0]})}" class="btn btn-danger"
                                        onclick="return confirm('Desea anular el ticket de pedido?')">Seleccionar</a>
                                </td>
                                <td><a th:href="@{/ticketpedido/habilitar/{id}(id=${t[0]})}" class="btn btn-warning"
                                        onclick="return confirm('Desea habilitar el ticket de pedido?')">Seleccionar</a>
                                </td>
                                <td>
                                    <button type="button" data-bs-toggle="modal" data-bs-target="#detalleModal"
                                        th:attr="data-id=${t[0]}" onclick="cargarDetalle(this)" class="btn btn-dark">
                                        Ver Detalle
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>


                <!-- Fin de Tabla -->


            </div>
        </div>


        <!-- Fin del card -->

    </div>

    <!-- Inicio del Modal Detalle -->
    <div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" id="detalleContenido">
                <!-- aqui se cargara el detalle -->
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '';
        console.log(contextPath);
        function cargarDetalle(boton) {
            let idTicket = boton.getAttribute("data-id");
            fetch(contextPath + 'ticketpedido/detalle/' + idTicket)
                .then(response => {
                    return response.text();
                })
                .then(html => {
                    document.getElementById('detalleContenido').innerHTML = html;
                })
                .catch(error => {

                });
        }
    </script>

    <script>
        function imprimirTicket() {

            // Elimina el foco del botón que lanzó la impresión
            if (document.activeElement) {
                document.activeElement.blur();
            }

            // Cierra el modal para evitar warning aria-hidden
            const modalElement = document.getElementById('detalleModal');

            if (modalElement) {
                const modal = bootstrap.Modal.getInstance(modalElement);

                if (modal) {
                    modal.hide();
                }
            }

            // Esperamos que cierre el modal
            setTimeout(() => {

                let contenido = document.querySelector('#detalleContenido .modal-body');

                if (!contenido) {
                    alert("No se encontró el contenido del ticket.");
                    return;
                }

                let fechaActual = new Date().toLocaleString('es-PE');

                let ventana = window.open('', '', 'width=900,height=700');

                ventana.document.write(`
            <!doctype html>
            <html lang="es">
            <head>
                <meta charset="utf-8">
                <title>Ticket de Pedido</title>

                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

                <style>

                    body{
                        padding:20px;
                        font-family:Arial,sans-serif;
                        -webkit-print-color-adjust:exact;
                        print-color-adjust:exact;
                    }

                    .cabecera-pdf{
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        border-bottom:2px solid #212529;
                        padding-bottom:10px;
                        margin-bottom:20px;
                    }

                    .cabecera-pdf h2{
                        margin:0;
                        font-weight:bold;
                    }

                    .fecha-pdf{
                        font-size:13px;
                        text-align:right;
                    }

                    .card{
                        border:1px solid #6c757d;
                        margin-bottom:15px;
                    }

                    .card-header{
                        font-weight:bold;
                    }

                    .table{
                        width:100%;
                        border-collapse:collapse;
                    }

                    .table th,
                    .table td{
                        border:1px solid #000;
                        padding:6px;
                    }

                    .table-dark th{
                        background:#212529 !important;
                        color:white !important;
                    }

                    .bg-dark{
                        background:#212529 !important;
                        color:white !important;
                    }

                    .bg-secondary{
                        background:#6c757d !important;
                        color:white !important;
                    }

                    .text-end{
                        text-align:right;
                    }

                    .text-primary{
                        color:#0d6efd !important;
                    }

                    .pie-pdf{
                        margin-top:30px;
                        padding-top:10px;
                        border-top:2px solid #212529;
                        text-align:center;
                        font-size:13px;
                        font-weight:bold;
                    }

                    @media print{
                        .btn,
                        .modal-footer{
                            display:none !important;
                        }
                    }

                </style>

            </head>

            <body>

                <div class="cabecera-pdf">

                    <h2>CiberElectrik</h2>

                    <div class="fecha-pdf">
                        <strong>Fecha de impresión:</strong><br>
                        ${fechaActual}
                    </div>

                </div>

                <div class="container">

                    ${contenido.innerHTML}

                </div>

                <div class="pie-pdf">

                    CiberElectrik

                </div>

            </body>
            </html>
        `);

                ventana.document.close();

                ventana.onload = function () {
                    ventana.focus();
                    ventana.print();
                    ventana.close();
                };

            }, 300);
        }
    </script>

</body>

</html>
