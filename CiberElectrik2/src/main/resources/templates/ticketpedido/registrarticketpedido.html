<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Ticket de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- script para la funcionalidad del registro de ticket de pedido  -->
    <script>
        function actualizarFechaHora() {
            let fecha = new Date();
            let fechaHora = fecha.toLocaleString('es-PE');
            document.getElementById("txtFec").value = fechaHora;
        }

        setInterval(actualizarFechaHora, 1000);
        window.onload = actualizarFechaHora;

        function actualizarProducto(select, index) {
            let codigo = select.options[select.selectedIndex].getAttribute("data-codigo");
            let precio = select.options[select.selectedIndex].getAttribute("data-precio");

            document.getElementById("codigo_" + index).value = codigo || "";
            document.getElementById("precio_" + index).value = precio || "";
        }

        function agregarfila() {
            let tbody = document.querySelector("#TbDetalleCompra tbody");
            let index = tbody.querySelectorAll("tr").length;

            let fila = document.createElement("tr");

            fila.innerHTML =
                "<td><input type='text' class='form-control' id='codigo_" + index + "' readonly></td>" +

                "<td>" +
                "<select class='form-select' name='productos' onchange='actualizarProducto(this," + index + ")' required>" +
                "<option value=''>Seleccione un producto</option>" +
                document.getElementById("opcionesProductos").innerHTML +
                "</select>" +
                "</td>" +

                "<td><input type='text' class='form-control' id='precio_" + index + "' name='precios' readonly required></td>" +

                "<td><input type='number' class='form-control' name='cantidades' min='1' value='1' required></td>" +

                "<td><button type='button' onclick='eliminarfila(this)' class='btn btn-danger'>Eliminar</button></td>";

            tbody.appendChild(fila);

            document.getElementById("txtCanCom").value = tbody.querySelectorAll("tr").length;
        }

        function eliminarfila(button) {
            let tbody = document.querySelector("#TbDetalleCompra tbody");
            let filas = tbody.querySelectorAll("tr");

            if (filas.length > 1) {
                button.closest("tr").remove();
                document.getElementById("txtCanCom").value = tbody.querySelectorAll("tr").length;
            } else {
                alert("Debe existir al menos un producto.");
            }
        }
    </script>
</head>


<body>


    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Registro de Ticket de Pedido</h1>
            </div>
            <div class="card-body">
                <form th:action="@{/ticketpedido/registrar}" method="post">
                    <div class="col-5">
                        <label for="txtNum" class="form-label">Numero de Compra:</label>
                        <input type="text" class="form-control" id="txtNum" name="txtNum" readonly th:value="${siguientenumero}">
                    </div>


                    <div class="col-5">
                        <label for="txtFec" class="form-label">Fecha:</label>
                        <input type="text" class="form-control" id="txtFec" name="txtFex" readonly>
                    </div>


                    <div class="col-5">
                        <label for="codemp" class="form-label">Empleado:</label>
                        <select class="form-select" name="codemp" id="codemp">
                            <option value="">Seleccione un Empleado</option>
                            <option th:each="e: ${listarempleado}" th:value="${e.codemp}"
                                th:text="|${e.nomemp} ${e.apepemp} ${e.apememp}|"></option>
                        </select>
                    </div>


                    <div class="col-5">
                        <label for="codcli" class="form-label">Cliente:</label>
                        <select class="form-select" name="codcli" id="codcli">
                            <option value="">Seleccione un cliente</option>
                            <option th:each="c: ${listarcliente}" th:value="${c.codcli}"
                                th:text="|${c.nomcli} ${c.apepcli} ${c.apemcli}|"></option>
                        </select>
                    </div>
                    <div class="col-5">
                        <label for="estado" class="form-label">Estado:</label>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" name="estado" id="estado" value="true" checked>
                            <label class="form-check-label" for="estado">Habilitado</label>
                        </div>
                    </div>
                    <hr>
                    <h3>Detalle de Compra</h3>
                    <div class="col-5">
                        <label for="txtCanCom" class="form-label">Cantidad de Compra:</label>
                        <input type="text" class="form-control" id="txtCanCom" name="txtCanCom" readonly value="1">
                    </div>
                    <div class="mb-3"></div>
                    <button type="button" class="btn btn-dark" onclick="agregarfila()">Agregar Productos</button>
                    <div class="mb-3"></div>
                    <!-- inicio de la tabla de detalle -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover bordered" id="TbDetalleCompra">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">Codigo</th>
                                    <th scope="col">Nombre</th>
                                    <th scope="col">Precio</th>
                                    <th scope="col">Cantidad</th>
                                    <th scope="col">Eliminar</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <input type="text" class="form-control" id="codigo_0" name="codigo[0]" readonly>
                                    </td>
                                    <td>
                                        <select class="form-select" name="productos"
                                            onchange="actualizarProducto(this,0)" required>
                                            <option value=""> Seleccione un producto</option>
                                            <option th:each="p: ${listarproducto}" th:value="${p.codigo}"
                                                th:text="|${p.nombre}|" th:data-codigo="${p.codigo}"
                                                th:data-precio="${p.precio}"></option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control" id="precio_0" name="precios" readonly>
                                    </td>
                                    <td>
                                        <input type="number" class="form-control" id="cantidad_0" name="cantidades" min="1" value="1">
                                    </td>
                                    <td>
                                        <button type="button" onclick="eliminarfila(this)"
                                            class="btn btn-danger">Eliminar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- agregamos combo de detalle-->
                        <select class="form-select" id="opcionesProductos" style="display: none;">
                            <option th:each="p: ${listarproducto}" th:value="${p.codigo}" th:text="|${p.nombre}|"
                                th:data-codigo="${p.codigo}" th:data-precio="${p.precio}"></option>
                        </select>



                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Registrar</button>
                            <a th:href="@{/ticketpedido/listar}" class="btn btn-dark">Regresar</a>
                        </div>
                    </div>
                    <!-- fin de la tabla -->
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>


</html>
