<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Actualizar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Actualizacion de Producto</h1>
        <!-- inicio del formulario -->
        <form class="row g-3" novalidate th:action="@{/producto/actualizar/{id}(id=${listarproducto.codigo})}" method="post" th:object="${listarproducto}">
            <div class="col-6">
                <label for="txtCod" class="form-label">Codigo:</label>
                <input type="text" class="form-control" id="txtCod" name="txtCod" th:field="*{codigo}" th:value="${listarproducto.codigo}">
            </div>
            <div class="col-6">
                <label for="txtNom" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="txtNom" name="txtNom" th:field="*{nombre}" th:value="${listarproducto.nombre}">
            </div>
            <div class="col-6">
                <label for="txtDes" class="form-label">Descripcion:</label>
                <textarea class="form-control" id="txtDes" th:field="*{descripcion}" th:value="${listarproducto.descripcion}"></textarea>
            </div>
            <div class="col-6">
                <label for="txtFec" class="form-label">Fecha de Ingreso:</label>
                <input type="date" class="form-control" id="txtFec" name="txtFec" th:field="*{fechaingreso}">
            </div>
            <div class="col-6">
                <label for="txtPre" class="form-label">Precio:</label>
                <input type="number" step="0.00001" class="form-control" id="txtPre" name="txtPre" th:field="*{precio}" th:value="${listarproducto.precio}">
            </div>
            <div class="col-6">
                <label for="txtCan" class="form-label">Cantidad:</label>
                <input type="number" class="form-control" id="txtCan" name="txtCan" th:field="*{cantidad}" th:value="${listarproducto.cantidad}">
            </div>
            <div class="col-6">
                <label for="cboMarca" class="form-label">Marca:</label>
                <select class="form-select" id="cboMarca" name="cboMarca" th:field="*{marca}">
                    <option selected value="0">Selccione una marca</option>
                    <option th:each="mar : ${listarmarca}" th:value="${mar.codigo}" th:text="${mar.nombre}"></option>
                </select>
            </div>
            <div class="col-6">
                <label for="cboCategoria" class="form-label">Categoria:</label>
                <select class="form-select" id="cboCategoria" name="cboCategoria" th:field="*{categoria}">
                    <option selected value="0">Selccione una categoria</option>
                    <option th:each="cat : ${listarcategoria}" th:value="${cat.codigo}" th:text="${cat.nombre}"></option>
                </select>
            </div>
            <div class="col-6">
                <label for="chkEst" class="form-label">Estado:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="chkEst" name="chkEst" th:field="*{estado}">
                    <label class="form-check-label" for="chkEst">
                        Habilitado
                    </label>
                </div>
            </div>
            <div class="mb-3"></div>
            <div class="col-12">
                <button class="btn btn-success" type="submit">Actualizar</button>
                <a href="#" class="btn btn-dark">Regresar</a>
            </div>
        </form>
        <!-- fin del formulario -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
