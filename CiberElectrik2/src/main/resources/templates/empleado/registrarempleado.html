<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Registrar Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Registro de Empleado</h1>
        <form class="row g-3 needs-validation" novalidate>
            <div class="col-4"><label class="form-label">Nombre:</label><input type="text" class="form-control"
                    name="txtNom" required></div>
            <div class="col-4"><label class="form-label">Ap. Paterno:</label><input type="text" class="form-control"
                    name="txtApeP" required></div>
            <div class="col-4"><label class="form-label">Ap. Materno:</label><input type="text" class="form-control"
                    name="txtApeM" required></div>
            <div class="col-4"><label class="form-label">Documento:</label><input type="text" class="form-control"
                    name="txtDoc" required></div>
            <div class="col-4"><label class="form-label">Fec. Nacimiento:</label><input type="date" class="form-control"
                    name="txtFec" required></div>
            <div class="col-4"><label class="form-label">Dirección:</label><input type="text" class="form-control"
                    name="txtDir" required></div>
            <div class="col-3"><label class="form-label">Teléfono:</label><input type="text" class="form-control"
                    name="txtTel"></div>
            <div class="col-3"><label class="form-label">Celular:</label><input type="text" class="form-control"
                    name="txtCel" required></div>
            <div class="col-6"><label class="form-label">Correo:</label><input type="email" class="form-control"
                    name="txtCor"></div>
            <div class="col-6"><label class="form-label">Usuario:</label><input type="text" class="form-control"
                    name="txtUsu" required></div>
            <div class="col-6"><label class="form-label">Clave:</label><input type="password" class="form-control"
                    name="txtCla" required></div>
            <div class="col-3"><label class="form-label">Distrito:</label><select class="form-select" name="cboDistrito"
                    required>
                    <option selected disabled value="">Seleccione...</option>
                </select></div>
            <div class="col-3"><label class="form-label">Sexo:</label><select class="form-select" name="cboSexo"
                    required>
                    <option selected disabled value="">Seleccione...</option>
                </select></div>
            <div class="col-3"><label class="form-label">Rol:</label><select class="form-select" name="cboRol" required>
                    <option selected disabled value="">Seleccione...</option>
                </select></div>
            <div class="col-3"><label class="form-label">Tipo Doc:</label><select class="form-select" name="cboTipoDoc"
                    required>
                    <option selected disabled value="">Seleccione...</option>
                </select></div>
            <div class="col-12"><label class="form-label">Estado:</label>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="chkEst" checked
                        required><label class="form-check-label">Habilitado</label></div>
            </div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Registrar</button> <a
                    th:href="@{/empleado/listar}" class="btn btn-dark">Regresar</a></div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
