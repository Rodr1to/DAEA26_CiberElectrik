<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Registrar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Registro de Producto</h1>
        <!-- inicio del formulario -->
        <form class="row g-3 needs-validation" novalidate th:action="@{/producto/registrar}" method="post" th:object="${producto}">
            <div class="col-6">
                <label for="txtNom" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="txtNom" name="txtNom" required
                    placeholder="Nombre de la categoria" th:field="*{nombre}">
                <div class="invalid-feedback">
                    Ingresa el nombre del Categoria
                </div>
            </div>
            <div class="col-6">
                <label for="txtDes" class="form-label">Descripcion:</label>
                <textarea class="form-control" id="txtDes" placeholder="Ingrese una descripcion" required th:field="*{descripcion}"></textarea>
                <div class="invalid-feedback">
                    Ingrese la descripcion
                </div>
            </div>
            <div class="col-6">
                <label for="txtFec" class="form-label">Fecha de Ingreso:</label>
                <input type="date" class="form-control" id="txtFec" name="txtFec" required th:field="*{fechaingreso}">
                <div class="invalid-feedback">
                    Seleccione la fecha de ingreso
                </div>
            </div>
            <div class="col-6">
                <label for="txtPre" class="form-label">Precio:</label>
                <input type="number" step="0.00001" class="form-control" id="txtPre" name="txtPre" required
                    placeholder="Ingrese el precio" th:field="*{precio}">
                <div class="invalid-feedback">
                    Ingresa el precio
                </div>
            </div>
            <div class="col-6">
                <label for="txtCan" class="form-label">Cantidad:</label>
                <input type="number" class="form-control" id="txtCan" name="txtCan" required
                    placeholder="Ingrese la cantidad" th:field="*{cantidad}">
                <div class="invalid-feedback">
                    Ingresa la cantidad
                </div>
            </div>
            <div class="col-6">
                <label for="cboMarca" class="form-label">Marca:</label>
                <select class="form-select" id="cboMarca" name="cboMarca" required th:field="*{marca}">
                    <option selected value="0">Selccione una marca</option>
                    <option th:each="mar : ${listarmarca}" th:value="${mar.codigo}" th:text="${mar.nombre}"></option>
                </select>
                <div class="invalid-feedback">
                    Selccione una marca
                </div>
            </div>
            <div class="col-6">
                <label for="cboCategoria" class="form-label">Categoria:</label>
                <select class="form-select" id="cboCategoria" name="cboCategoria" required th:field="*{categoria}">
                    <option selected value="0">Selccione una categoria</option>
                    <option th:each="cat : ${listarcategoria}" th:value="${cat.codigo}" th:text="${cat.nombre}"></option>
                </select>
                <div class="invalid-feedback">
                    Selccione una categoria
                </div>
            </div>
            <div class="col-6">
                <label for="chkEst" class="form-label">Estado:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="chkEst" name="chkEst" required th:field="*{estado}">
                    <label class="form-check-label" for="chkEst">
                        Habilitado
                    </label>
                </div>
            </div>
            <div class="mb-3"></div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Registrar</button>
                <a th:href="@{/producto/listar}" class="btn btn-dark">Regresar</a>
            </div>
        </form>
        <!-- fin del formulario -->
    </div>

    <!-- inicio de la validacion con Java Script -->
    <script>
        (() => {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
    <!-- fin de la validacion -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
