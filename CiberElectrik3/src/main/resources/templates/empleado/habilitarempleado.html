<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Habilitar Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Habilitacion de Empleados</h1>
        <a th:href="@{/empleado/listar}" class="btn btn-dark">Regresar</a>
        <div class="mb-3"></div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Doc</th>
                        <th>Estado</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${empleados}" th:if="${!e.estemp}">
                        <td th:text="${e.codemp}"></td>
                        <td th:text="${e.nomemp + ' ' + e.apepemp}"></td>
                        <td th:text="${e.docemp}"></td>
                        <td>Inactivo</td>
                        <td><a href="#" class="btn btn-warning">Habilitar</a></td>
                        <td><a href="#" class="btn btn-danger">Deshabilitar</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
