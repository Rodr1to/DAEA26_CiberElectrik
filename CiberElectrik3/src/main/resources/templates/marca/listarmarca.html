<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Mostrar Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Listado de Marcas</h1>
        <a th:href="@{/marca/registro}" class="btn btn-primary">Registrar Marca</a> <a th:href="@{/marca/habilita}"
            class="btn btn-warning">Habilitar Marca</a> <a th:href="@{/menuprincipal}" class="btn btn-dark">Regresar</a>
        <div class="mb-3"></div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Codigo</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Actualizar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${marcas}">
                        <td th:text="${m.codmar}"></td>
                        <td th:text="${m.nommar}"></td>
                        <td th:text="${m.estmar ? 'Activo' : 'Inactivo'}"></td>
                        <td><a th:href="@{/marca/actualizar}" class="btn btn-success">Actualizar</a></td>
                        <td><a th:href="@{/marca/eliminar}" class="btn btn-danger">Eliminar</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
