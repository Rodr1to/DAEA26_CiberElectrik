<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Registrar Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Registro de Marcas</h1>
        <form class="g-3 needs-validation" novalidate>
            <div class="col-6">
                <label class="form-label">Nombre:</label><input type="text" class="form-control" name="txtNom" required
                    placeholder="Nombre de la marca">
                <div class="invalid-feedback">Ingresa el nombre de la marca</div>
            </div>
            <div class="col-6">
                <label class="form-label">Estado:</label>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="chkEst" required><label
                        class="form-check-label">Habilitado</label></div>
            </div>
            <div class="mb-3"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Registrar</button> <a
                    th:href="@{/marca/listar}" class="btn btn-dark">Regresar</a></div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
