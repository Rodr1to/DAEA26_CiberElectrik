<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Mostrar Tipo Documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Listado de Tipos de Documento</h1>
        <a th:href="@{/tipodocumento/registro}" class="btn btn-primary">Registrar Tipo Doc</a>
        <a th:href="@{/tipodocumento/habilita}" class="btn btn-warning">Habilitar Tipo Doc</a>
        <a th:href="@{/menuprincipal}" class="btn btn-dark">Regresar</a>
        <div class="mb-3"></div>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Codigo</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Actualizar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tipos}">
                        <td th:text="${t.codtipd}"></td>
                        <td th:text="${t.nomtipd}"></td>
                        <td th:text="${t.esttipd ? 'Activo' : 'Inactivo'}"></td>
                        <td><a th:href="@{/tipodocumento/actualizar/{id}(id=${t.codtipd})}"
                                class="btn btn-success">Actualizar</a></td>
                        <td><a th:href="@{/tipodocumento/eliminar/{id}(id=${t.codtipd})}"
                                class="btn btn-danger">Eliminar</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
