spring.application.name=CiberElectrik

# definir el puerto con el cual se accedera a la aplicacion
server.port=8089
# url del proyecto
server.servlet.context-path=/ciberelectrik
# cadena de conexion
spring.datasource.url=jdbc:mysql://localhost:3306/bdciberelectrik20261?useSSL=false&serverTimezone=UTC
# usuario de la bd
spring.datasource.username=root
# clave de la bd
spring.datasource.password=
# driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# jpa/hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none