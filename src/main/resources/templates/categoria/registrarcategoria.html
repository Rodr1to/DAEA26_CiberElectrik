<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Registrar Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Registro de Categorias</h1>
        <form class="g-3 needs-validation" novalidate th:action="@{/categoria/guardar}" method="post">
            <div class="col-6">
                <label for="txtNom" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="txtNom" name="txtNom" required
                    placeholder="Nombre de la categoria">
                <div class="invalid-feedback">
                    Ingresa el nombre de la categoria
                </div>
            </div>
            <div class="col-6">
                <label for="chkEst" class="form-label">Estado:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="chkEst" name="chkEst" checked required>
                    <label class="form-check-label" for="chkEst">
                        Habilitado
                    </label>
                </div>
            </div>
            <div class="mb-3"></div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Registrar</button>
                <a th:href="@{/categoria/listar}" class="btn btn-dark">Regresar</a>
            </div>
        </form>
    </div>

    <!-- inicio de la validacion del formulario con JS -->
    <script>
        (() => {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
    <!-- fin de la validacion del formulario con JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
