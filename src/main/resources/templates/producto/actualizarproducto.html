<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CiberElectrik | Actualizar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Actualizacion de Producto</h1>
        <!-- inicio del formulario -->
        <form class="row g-3" novalidate>

            <div class="col-6">
                <label for="txtCod" class="form-label">Código:</label>
                <input type="text" class="form-control" id="txtCod" name="txtCod">

            </div>

            <div class="col-6">
                <label for="txtNom" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="txtNom" name="txtNom">
            </div>

            <div class="col-6">
                <label for="txtDes" class="form-label">Descripcion:</label>
                <textarea class="form-control" id="txtDes"></textarea>
            </div>

            <div class="col-6">
                <label for="txtFec" class="form-label">Fec. Ingreso:</label>
                <input type="date" class="form-control" id="txtFec" name="txtFec">

            </div>

            <div class="col-6">
                <label for="txtPre" class="form-label">Precio:</label>
                <input type="number" step="0.01" class="form-control" id="txtPre" name="txtPre">
            </div>

            <div class="col-6">
                <label for="txtCan" class="form-label">Cantidad:</label>
                <input type="number" class="form-control" id="txtCan" name="txtCan">
            </div>

            <div class="col-6">
                <label for="cboMarca" class="form-label">Marca:</label>
                <select class="form-select" id="cboMarca" name="cboMarca">
                    <option selected disabled value="">Seleccione una marca</option>
                    <option>...</option>
                </select>
            </div>

            <div class="col-6">
                <label for="cboCategoria" class="form-label">Categoria:</label>
                <select class="form-select" id="cboCategoria" name="cboCategoria">
                    <option selected disabled value="">Seleccione una categoria</option>
                    <option>...</option>
                </select>
            </div>

            <div class="col-6">
                <label for="chkEst" class="form-label">Estado:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="chkEst" name="chkEst">
                    <label class="form-check-label" for="chkEst">
                        Habilitado
                    </label>
                </div>
            </div>
            <div class="mb-3"></div>
            <div class="col-12">
                <button class="btn btn-success" type="submit">Actualizar</button>
                <a href="#" class="btn btn-dark">Regresar</a>
            </div>
        </form>
        <!-- fin del formulario -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
